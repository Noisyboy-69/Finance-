name: Build Finance APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Clean
        run: flutter clean

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Build APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false
        run: |
          set +e
          flutter build apk --release --android-skip-build-dependency-validation --verbose
          FLUTTER_EXIT=$?
          set -e

          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "Flutter output found."
            exit 0
          fi

          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Gradle produced the APK; copying it to Flutter's expected artifact path."
            mkdir -p build/app/outputs/flutter-apk
            cp "android/app/build/outputs/apk/release/app-release.apk" "build/app/outputs/flutter-apk/app-release.apk"
            exit 0
          fi

          echo "No release APK found. Flutter exit code: $FLUTTER_EXIT"
          exit $FLUTTER_EXIT

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestore-Finanze-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
