name: Build Final Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: gestore_finanze_v11
        run: flutter pub get

      - name: Analyze
        working-directory: gestore_finanze_v11
        run: flutter analyze

      - name: Build APK
        working-directory: gestore_finanze_v11
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Finance-final-release
          path: gestore_finanze_v11/build/app/outputs/flutter-apk/app-release.apk
