name: Build Finance APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Clean
        run: flutter clean

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK with Gradle
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        run: |
          echo "APK files produced by Gradle:"
          find android/app/build/outputs -type f -name '*.apk' -print || true

          APK="$(find android/app/build/outputs -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No APK was produced."
            echo "Relevant output tree:"
            find android/app/build -maxdepth 5 -type f | sort | tail -200 || true
            exit 1
          fi

          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestore-Finanze-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
