plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.gestorefinanze.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.gestorefinanze.app'
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

flutter { source '../..' }
